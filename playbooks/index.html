<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CR911 Playbooks</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap">
<style>
  body{margin:0;background:linear-gradient(180deg,#071024 0%,#0b1226 100%);color:#e6eef8;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial}
  .wrap{max-width:900px;margin:0 auto;padding:28px 20px}
  a{color:#bfefff;text-decoration:none}
  a:hover{text-decoration:underline}
  .muted{color:#9fb0c9}
  .card{background:linear-gradient(180deg,rgba(255,255,255,0.03),rgba(255,255,255,0.02));border-radius:14px;padding:18px;box-shadow:0 6px 18px rgba(2,6,23,.6);margin-bottom:16px}
  .section{margin:14px 0 18px}
  .section h3{margin:0 0 10px;font-size:16px}
  ul{padding-left:18px;margin:0}
  li{margin:8px 0}
  .meta{display:inline-block;margin-left:10px;font-size:12px;color:#9fb0c9}
</style>
</head>
<body>
<div class="wrap">
  <h1 style="color:#00d9a3;margin:0 0 8px">CR911 Playbooks</h1>
  <div class="muted">Click a technique to view its rendered playbook.</div>

  <div class="card" id="pb-root">
    <div class="muted">Loading playbooks…</div>
  </div>

  <p><a href="../cr911-matrix.html">← Back to Matrix</a></p>
</div>

<script>
  const tacticOrder = [
    'reconnaissance','resource-development','initial-access','execution','persistence',
    'privilege-escalation','defense-evasion','credential-access','discovery','lateral-movement',
    'collection','command-and-control','exfiltration','impact'
  ];

  const tacticTitle = id => id
    ? id.split('-').map(p=>p.charAt(0).toUpperCase()+p.slice(1)).join(' ')
    : 'Unmapped';

  function metaToObject(metadataArr){
    const o = {};
    (metadataArr||[]).forEach(m => { if(m && m.name) o[m.name] = m.value; });
    return o;
  }

  function normalizePlaybookId(v){
    let s = String(v||'').trim();
    if(!s) return null;
    s = s.replace(/^playbooks\//,'');
    s = s.replace(/\.md$/i,'');
    return s || null;
  }

  // Map CyRECS IDs -> existing repo playbook filenames (WITHOUT .md)
  // (These filenames match your /playbooks/*.md files)
  const playbookIdByCyrecs = {
    "CR-IA-01": "phishing_workstation",
    "CR-IA-02": "supply_chain_component",
    "CR-IA-03": "legacy_protocol_injection",

    "CR-ID-01": "caller_id_spoof",
    "CR-ID-02": "lis_impersonation",

    "CR-PA-01": "protocol_downgrade",
    "CR-PA-02": "rtp_injection",

    "CR-CO-01": "data_exfil_lis",

    "CR-DM-01": "lvf_gis_poison",
    "CR-DM-02": "lis_data_tamper",

    "CR-SD-01": "tdos_sip_flood",
    "CR-SD-03": "lpg_isolation",

    "CR-IM-01": "ransomware_psap",

    "CR-VE-01": "sw_bugs_esrp",
    "CR-MC-01": "misconfig_admin",

    // Optional/extra playbooks you currently have in repo:
    // "CR-??-??": "lis_query_flood"
  };

  function getCyrecsId(meta){
    return meta["CyRECS ID"] || meta["CyRECS IDs"] || "";
  }

  function getDisplayName(meta, entry){
    return meta["Display Name"] || meta["Technique Name"] || entry.comment || entry.techniqueID || "Unnamed technique";
  }

  function getPlaybookId(meta, cyrecsId){
    const direct = normalizePlaybookId(meta["Playbook"] || meta["Playbooks"] || "");
    if(direct) return direct;
    if(cyrecsId && playbookIdByCyrecs[cyrecsId]) return playbookIdByCyrecs[cyrecsId];
    return null;
  }

  (async ()=>{
    let layer = null;
    try{
      const res = await fetch('../ng911_attck_layer.json', {cache:'no-store'});
      if(res.ok) layer = await res.json();
    }catch(e){}

    const root = document.getElementById('pb-root');
    if(!layer || !Array.isArray(layer.techniques)){
      root.innerHTML = '<div class="muted">Error loading ng911_attck_layer.json</div>';
      return;
    }

    // Bucket by tactic
    const buckets = new Map();
    (layer.techniques||[]).forEach(entry=>{
      const tid = entry.tactic || 'unmapped';
      if(!buckets.has(tid)){
        buckets.set(tid, { id: tid, name: tacticTitle(tid), items: [] });
      }
      const meta = metaToObject(entry.metadata||[]);
      const cyrecsId = getCyrecsId(meta);
      const name = getDisplayName(meta, entry);
      const pbId = getPlaybookId(meta, cyrecsId);

      buckets.get(tid).items.push({
        name,
        cyrecsId,
        techniqueID: entry.techniqueID || "",
        playbookId: pbId
      });
    });

    // Sort buckets in a nice order
    const ordered = Array.from(buckets.values()).sort((a,b)=>{
      const ai = tacticOrder.indexOf(a.id);
      const bi = tacticOrder.indexOf(b.id);
      if(ai === -1 && bi === -1) return a.name.localeCompare(b.name);
      if(ai === -1) return 1;
      if(bi === -1) return -1;
      return ai - bi;
    });

    // Sort items by name
    ordered.forEach(b => b.items.sort((x,y)=> (x.name||"").localeCompare(y.name||"")));

    // Render
    root.innerHTML = '';
    ordered.forEach(b=>{
      const sec = document.createElement('div');
      sec.className = 'section';
      sec.innerHTML = `<h3>${b.name}</h3>`;
      const ul = document.createElement('ul');

      b.items.forEach(it=>{
        const li = document.createElement('li');

        const metaBits = [it.cyrecsId, it.techniqueID].filter(Boolean).join(' • ');
        const metaSpan = metaBits ? ` <span class="meta">(${metaBits})</span>` : '';

        if(it.playbookId){
          li.innerHTML = `<a href="view.html?id=${encodeURIComponent(it.playbookId)}">${it.name}</a>${metaSpan}`;
        }else{
          li.innerHTML = `<span class="muted">${it.name}</span>${metaSpan} <span class="meta muted">(no playbook)</span>`;
        }

        ul.appendChild(li);
      });

      sec.appendChild(ul);
      root.appendChild(sec);
    });
  })();
</script>
<footer>
  Sources: NENA i3 (i3), NG-SEC, and internal Threat Modeling.
  <br><br>
  <a class="btn" href="feedback.html">Submit feedback</a>
  <a class="btn"
     href="https://github.com/iSTAR-Lab/cr911-threat-mapping/issues/new?template=recommendation.yml"
     target="_blank">
    Suggest via GitHub
  </a>
</footer>
</body>
</html>
